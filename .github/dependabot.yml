version: 2

updates:
  # ---------------------------------------------------------------------------------
  # npm
  # ---------------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps(dev)'
    groups:
      # Runtime dependencies ship to users, so a major here changes what the browser
      # executes. Minor and patch are grouped into one reviewable pull request; majors
      # are deliberately left out of the group so each arrives on its own with its own
      # changelog to read. React 20 and MuPDF 2 should never land in a batch.
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      # Build and test tooling never reaches a user, so the calculus is different: the
      # risk is a broken build, which CI catches on the pull request itself. Majors are
      # grouped in with the rest because a Vite or Vitest major is best taken whole
      # rather than interleaved with half its plugin ecosystem.
      development:
        dependency-type: development
        update-types:
          - major
          - minor
          - patch

    ignore:
      # TypeScript majors are pinned by a peer range, not by preference.
      #
      # typescript-eslint@8.x declares `peer typescript ">=4.8.4 <6.1.0"`. Dependabot
      # proposed TypeScript 7.0.2 in its first run; `npm ci` then failed to resolve and
      # every gate behind it never ran. The pin moves when typescript-eslint widens its
      # range, which is a decision to take deliberately rather than to rediscover as a
      # red pull request every week.
      #
      # Minor and patch updates still flow through the development group above.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # ---------------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------------
  # Every `uses:` in this repository is pinned to a full commit SHA. Dependabot
  # understands that and rewrites both the SHA and the trailing version comment, which is
  # the only maintainable way to keep SHA pinning honest: a pinned action nobody updates
  # is a pinned known-vulnerable action.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-rust
      - /.github/actions/setup-emsdk
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns:
          - '*'

  # ---------------------------------------------------------------------------------
  # Cargo
  # ---------------------------------------------------------------------------------
  # Commented out until crates/pdftext/ exists.
  #
  # The `directories: [/crates/*]` glob was expected to make this harmless before the
  # crate lands. It does not: Dependabot errors on a glob that matches nothing, and the
  # first scheduled run failed. A job that fails every week for a known, uninteresting
  # reason is exactly the noise that teaches people to ignore red, which is why timing
  # checks are also kept off the blocking path.
  #
  # Restore this block, with `directory: /crates/pdftext`, in the same commit that adds
  # the crate. The `ignore` list below is the part that must not be lost: those three
  # crates are refused by scripts/check-supply-chain.mjs, each for a specific advisory
  # recorded in docs/THIRD-PARTY.md, and Dependabot proposing them would rediscover the
  # denial as a failing gate.
  #
  # - package-ecosystem: cargo
  #   directory: /crates/pdftext
  #   schedule:
  #     interval: weekly
  #     day: monday
  #     time: '06:00'
  #     timezone: Etc/UTC
  #   open-pull-requests-limit: 10
  #   labels:
  #     - dependencies
  #     - rust
  #   commit-message:
  #     prefix: 'deps'
  #   groups:
  #     cargo:
  #       patterns:
  #         - '*'
  #       update-types:
  #         - minor
  #         - patch
  #   ignore:
  #     - dependency-name: rustybuzz    # RUSTSEC-2026-0206 unmaintained; use harfrust
  #     - dependency-name: ttf-parser   # RUSTSEC-2026-0192 unmaintained; use skrifa
  #     - dependency-name: rsa          # RUSTSEC-2023-0071 unpatched; sign via WebCrypto
