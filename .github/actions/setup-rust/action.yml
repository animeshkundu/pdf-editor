name: Set up Rust
description: >-
  Installs rustup, a toolchain and any requested targets idempotently, then restores
  the cargo and target caches. Safe to run repeatedly on a persistent self-hosted
  runner and a no-op once the toolchain is already present.

inputs:
  toolchain:
    description: >-
      Toolchain to install and make the default. `stable` is deliberate: if
      crates/pdftext/ later adds a rust-toolchain.toml, rustup honours that file over
      this default automatically, so pinning here would only create a second source of
      truth that could silently disagree with the crate's own.
    required: false
    default: stable
  targets:
    description: Space-separated rustup targets to add on top of the host target.
    required: false
    default: ''
  components:
    description: Comma-separated rustup components.
    required: false
    default: clippy,rustfmt
  audit:
    description: >-
      Install cargo-audit. Only worth the compile time on the jobs that run
      `npm run check:supply`, and it is skipped entirely until crates/pdftext/ exists
      because check-supply-chain.mjs does not look for it before then.
    required: false
    default: 'false'
  cache:
    description: Restore and save the cargo registry and build caches.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # rustup's own installer is not idempotent in the useful sense: re-running it on a
    # machine that already has rustup prompts or errors. Probing first is what makes
    # this safe on a runner whose $HOME survives between jobs.
    - name: Install rustup if absent
      shell: bash
      run: |
        set -euo pipefail
        if command -v rustup >/dev/null 2>&1; then
          echo "rustup already present: $(rustup --version)"
        else
          echo "rustup not found; installing."
          curl --proto '=https' --tlsv1.2 --retry 3 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
        fi
        # The installer only edits shell profiles, which GitHub Actions steps do not
        # source. GITHUB_PATH is how the rest of the job sees cargo.
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Install toolchain, components and targets
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        export PATH="$HOME/.cargo/bin:$PATH"

        # Every rustup subcommand below is a no-op when already satisfied, so the whole
        # step costs a few seconds on a warm runner.
        install_args=(toolchain install "$TOOLCHAIN" --profile minimal --no-self-update)
        if [ -n "$COMPONENTS" ]; then
          IFS=',' read -ra parts <<< "$COMPONENTS"
          for part in "${parts[@]}"; do
            [ -n "$part" ] && install_args+=(--component "$part")
          done
        fi
        rustup "${install_args[@]}"
        rustup default "$TOOLCHAIN"

        for target in $TARGETS; do
          rustup target add --toolchain "$TOOLCHAIN" "$target"
        done

        rustc --version
        cargo --version

    # Keyed on the lockfile so a dependency bump gets a fresh cache, with a prefix-only
    # restore key so an unchanged-toolchain bump still starts warm. hashFiles returns an
    # empty string when nothing matches, which is a stable key in its own right, but the
    # step is skipped in that case rather than storing an empty cache entry.
    - name: Restore cargo caches
      if: inputs.cache == 'true' && hashFiles('crates/**/Cargo.toml') != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          crates/pdftext/target
        key: cargo-${{ runner.os }}-${{ inputs.toolchain }}-${{ hashFiles('crates/**/Cargo.lock', 'crates/**/Cargo.toml') }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ inputs.toolchain }}-

    - name: Install cargo-audit
      if: inputs.audit == 'true'
      shell: bash
      run: |
        set -euo pipefail
        export PATH="$HOME/.cargo/bin:$PATH"

        # check-supply-chain.mjs only requires cargo-audit once crates/pdftext/Cargo.lock
        # exists, and only fails on its absence when CI is set. Installing it before then
        # would burn several minutes of compile time on every run for no gate.
        if [ ! -f crates/pdftext/Cargo.toml ]; then
          echo "crates/pdftext not created yet; cargo-audit not needed."
          exit 0
        fi

        if command -v cargo-audit >/dev/null 2>&1; then
          echo "cargo-audit already present: $(cargo audit --version)"
          exit 0
        fi

        echo "Installing cargo-audit (one-time compile on this runner)."
        cargo install --locked cargo-audit
