name: Set up Rust
description: >-
  Installs rustup, a toolchain and any requested targets idempotently, then restores
  the cargo and target caches. Safe to run repeatedly on a persistent self-hosted
  runner and a no-op once the toolchain is already present.

inputs:
  toolchain:
    description: >-
      Toolchain to install and make the default. `stable` is deliberate: if
      crates/pdftext/ later adds a rust-toolchain.toml, rustup honours that file over
      this default automatically, so pinning here would only create a second source of
      truth that could silently disagree with the crate's own.
    required: false
    default: stable
  targets:
    description: Space-separated rustup targets to add on top of the host target.
    required: false
    default: ''
  components:
    description: Comma-separated rustup components.
    required: false
    default: clippy,rustfmt
  audit:
    description: >-
      Install cargo-audit and cargo-deny. Only worth the compile time on the jobs that
      run the supply-chain gates, and skipped entirely until crates/pdftext/ exists
      because neither gate looks for a crate graph before then.
    required: false
    default: 'false'
  cache:
    description: Restore and save the cargo registry and build caches.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # rustup's own installer is not idempotent in the useful sense: re-running it on a
    # machine that already has rustup prompts or errors. Probing first is what makes
    # this safe on a runner whose $HOME survives between jobs.
    - name: Install rustup if absent
      shell: bash
      run: |
        set -euo pipefail
        if command -v rustup >/dev/null 2>&1; then
          echo "rustup already present: $(rustup --version)"
        else
          echo "rustup not found; installing."
          curl --proto '=https' --tlsv1.2 --retry 3 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
        fi
        # The installer only edits shell profiles, which GitHub Actions steps do not
        # source. GITHUB_PATH is how the rest of the job sees cargo.
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Install toolchain, components and targets
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        export PATH="$HOME/.cargo/bin:$PATH"

        # Same shared-$HOME hazard as the emsdk action: several runner processes on one
        # machine write the same ~/.rustup and ~/.cargo. rustup is not concurrency-safe
        # against itself, and two simultaneous `toolchain install` runs can leave a
        # half-unpacked toolchain that fails much later with a confusing error.
        if command -v flock >/dev/null 2>&1; then
          exec 9>"$HOME/.rustup-setup.lock"
          flock 9
        else
          echo "::warning::flock not found; concurrent jobs on this runner could race" \
               "over ~/.rustup. Install util-linux on the runner image."
        fi

        # Every rustup subcommand below is a no-op when already satisfied, so the whole
        # step costs a few seconds on a warm runner.
        #
        # Except that "no-op" is not free. `toolchain install` on an already-installed
        # toolchain still reinstalls any component named with --component, and that
        # reinstall moves files through $RUSTUP_HOME/tmp. On an ephemeral container whose
        # image ships a preinstalled toolchain, the toolchain directory and the tmp
        # directory can land on different overlay layers, and the move fails with
        # "Invalid cross-device link (os error 18)" while rolling back a component that
        # was already correct. Observed on this runner image.
        #
        # So satisfy-then-skip: only touch rustup when something is genuinely missing.
        have_toolchain=0
        rustup toolchain list 2>/dev/null | grep -q "^${TOOLCHAIN}-" && have_toolchain=1

        missing=""
        if [ "$have_toolchain" = "1" ] && [ -n "$COMPONENTS" ]; then
          installed="$(rustup component list --toolchain "$TOOLCHAIN" --installed 2>/dev/null || true)"
          IFS=',' read -ra parts <<< "$COMPONENTS"
          for part in "${parts[@]}"; do
            [ -z "$part" ] && continue
            grep -q "^${part}" <<< "$installed" || missing="$missing,$part"
          done
        fi

        if [ "$have_toolchain" = "1" ] && [ -z "$missing" ]; then
          echo "Toolchain $TOOLCHAIN and components already present; not touching rustup."
          rustup default "$TOOLCHAIN" >/dev/null 2>&1 || true
        else
          install_args=(toolchain install "$TOOLCHAIN" --profile minimal --no-self-update)
          # Only ask for what is actually absent, so a healthy component is never
          # reinstalled and can never trip the cross-device rollback above.
          want="${missing:-$COMPONENTS}"
          if [ "$have_toolchain" = "0" ]; then want="$COMPONENTS"; fi
          if [ -n "$want" ]; then
            IFS=',' read -ra parts <<< "$want"
            for part in "${parts[@]}"; do
              [ -n "$part" ] && install_args+=(--component "$part")
            done
          fi
          rustup "${install_args[@]}"
          rustup default "$TOOLCHAIN"
        fi

        for target in $TARGETS; do
          rustup target list --toolchain "$TOOLCHAIN" --installed 2>/dev/null \
            | grep -qx "$target" || rustup target add --toolchain "$TOOLCHAIN" "$target"
        done

        rustc --version
        cargo --version

    # Keyed on the lockfile so a dependency bump gets a fresh cache, with a prefix-only
    # restore key so an unchanged-toolchain bump still starts warm. hashFiles returns an
    # empty string when nothing matches, which is a stable key in its own right, but the
    # step is skipped in that case rather than storing an empty cache entry.
    - name: Restore cargo caches
      if: inputs.cache == 'true' && hashFiles('crates/**/Cargo.toml') != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          crates/pdftext/target
        key: cargo-${{ runner.os }}-${{ inputs.toolchain }}-${{ hashFiles('crates/**/Cargo.lock', 'crates/**/Cargo.toml') }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ inputs.toolchain }}-

    - name: Install cargo-audit and cargo-deny
      if: inputs.audit == 'true'
      shell: bash
      run: |
        set -euo pipefail
        export PATH="$HOME/.cargo/bin:$PATH"

        # The supply-chain gates only require these once crates/pdftext/ exists, and both
        # scripts exit 0 before then. Installing them earlier would burn several minutes
        # of compile time on every run for no gate at all.
        if [ ! -f crates/pdftext/Cargo.toml ]; then
          echo "crates/pdftext not created yet; cargo-audit and cargo-deny not needed."
          exit 0
        fi

        # `cargo install` writes to the shared ~/.cargo/bin, so it takes the same lock as
        # the toolchain step. Re-probing inside the lock matters: two jobs can both miss a
        # binary above, and only one of them should pay for the compile.
        if command -v flock >/dev/null 2>&1; then
          exec 9>"$HOME/.rustup-setup.lock"
          flock 9
        fi

        # cargo-audit covers advisories; cargo-deny covers licenses, bans and sources.
        # They answer different questions, so both gates need their own binary.
        for tool in cargo-audit cargo-deny; do
          if command -v "$tool" >/dev/null 2>&1; then
            echo "$tool already present."
          else
            echo "Installing $tool (one-time compile on this runner)."
            cargo install --locked "$tool"
          fi
        done
