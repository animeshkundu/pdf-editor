name: WASM artifacts

# Rebuilds the two native artifacts and publishes them for a human to commit.
#
# This is a separate workflow from CI on purpose. Emscripten and Binaryen are slow, and
# the artifacts they produce change only when their inputs do. Running them on every
# pull request would add many minutes to the feedback loop of changes that cannot
# possibly affect them. So CI verifies the COMMITTED artifacts against
# vendor/wasm-manifest.json instead, and this workflow is what regenerates them.
#
# It deliberately does not commit anything. The artifacts are binaries that ship to
# users; a bot pushing them to main without a person looking would be the wrong trade,
# and a token with contents:write on a workflow triggered by path changes is a wider
# blast radius than this is worth. Download, verify, commit.

on:
  push:
    branches: [main]
    paths:
      # vendor/mupdf-wasm/src/ is gitignored, so a source change never reaches here
      # directly. What does reach here is the vendoring script and the patch set that
      # produce that tree, which is the thing actually under version control.
      #
      # package-lock.json is deliberately NOT a trigger. Every script this workflow runs
      # is dependency-free Node ESM, so an npm bump cannot change what the native build
      # produces, and listing it would fire a 60-minute Emscripten job on every routine
      # dependency pull request.
      - 'vendor/**'
      - 'crates/**'
      - 'scripts/build-wasm.mjs'
      - 'scripts/build-rust-wasm.mjs'
      - 'scripts/setup-wasm-tools.mjs'
      - 'scripts/vendor-mupdf.mjs'
      - '.github/workflows/wasm.yml'
      - '.github/actions/setup-emsdk/action.yml'
      - '.github/actions/setup-rust/action.yml'
  pull_request:
    branches: [main]
    paths:
      - 'vendor/**'
      - 'crates/**'
      - 'scripts/build-wasm.mjs'
      - 'scripts/build-rust-wasm.mjs'
      - 'scripts/setup-wasm-tools.mjs'
      - 'scripts/vendor-mupdf.mjs'
      - '.github/workflows/wasm.yml'
      - '.github/actions/setup-emsdk/action.yml'
      - '.github/actions/setup-rust/action.yml'
  workflow_dispatch:

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The two engines are independent, so they run in parallel. Splitting them also keeps
  # each hosted job short, gives failures a narrower retry scope, and provides results for
  # one engine without waiting for the other.
  mupdf:
    name: MuPDF (Emscripten)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install exact Node dependencies
        run: npm ci --include=dev

      # The vendored MuPDF source is fetched on demand rather than committed, so it has
      # to be materialised before anything else can see it. This runs BEFORE the emsdk
      # setup on purpose: the fork pins its own Emscripten version in
      # vendor/mupdf-wasm/.emscripten-version, and that file does not exist until
      # vendoring has written it. Setting up the SDK first would silently install the
      # action's default version and ignore the pin.
      #
      # Guarded because the vendoring script lands with the fork itself; until then
      # build-wasm.mjs takes its documented no-op path.
      - name: Vendor and patch the MuPDF source
        run: |
          set -euo pipefail
          if [ -f scripts/vendor-mupdf.mjs ]; then
            node scripts/vendor-mupdf.mjs
          else
            echo "scripts/vendor-mupdf.mjs does not exist yet; nothing to vendor."
          fi

      # Restore the SDK BEFORE setting it up, so the action's own "reuse the existing
      # checkout" path is what runs on a hit. Moving off a persistent runner turned the
      # toolchain from something installed once into a ~1 GB download on every job; this
      # is what keeps that a one-time cost per Emscripten pin.
      #
      # Keyed on the pin alone, because that is the only input that changes what gets
      # installed. Unlike the build-tree cache below, a partial restore here is harmless:
      # `emsdk install` reconciles whatever it finds against the requested version, and a
      # wrong or truncated SDK cannot silently produce artifacts that mismatch their
      # manifest the way stale object files can. So this one does get a restore-key.
      - name: Cache the Emscripten SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/emsdk
          key: >-
            emsdk-${{ runner.os }}-${{
            hashFiles('vendor/mupdf-wasm/.emscripten-version') }}
          restore-keys: |
            emsdk-${{ runner.os }}-

      - name: Set up Emscripten
        uses: ./.github/actions/setup-emsdk

      # Content-hash keyed on everything that can change the output: the vendoring script
      # and its patch set, the build script, and the toolchain pin. An Emscripten build
      # is tens of minutes, so a hit here is the difference between a workflow people run
      # and one they avoid. The restore-key prefix deliberately has no fallback: a
      # partial-match restore would seed the build cache from a DIFFERENT source tree,
      # and stale object files are exactly how a build silently produces artifacts that
      # do not match their manifest.
      - name: Cache the MuPDF build tree
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/mupdf-wasm/build
          key: >-
            mupdf-${{ runner.os }}-${{ hashFiles('vendor/mupdf-wasm/.emscripten-version',
            'vendor/mupdf-wasm/patches/**', 'scripts/vendor-mupdf.mjs',
            'scripts/build-wasm.mjs') }}

      - name: Build the forked MuPDF WASM engine
        run: npm run build:wasm

      # Proves the freshly built artifacts agree with the manifest the build wrote, so a
      # manifest that was not regenerated fails here rather than on the next CI run.
      - name: Verify the artifacts against their manifest
        run: npm run check:wasm:fresh

      - name: Upload MuPDF artifacts for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mupdf-wasm-${{ github.sha }}
          path: |
            vendor/mupdf-wasm/dist/
            vendor/wasm-manifest.json
          if-no-files-found: warn
          retention-days: 30

  pdftext:
    name: pdftext (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install exact Node dependencies
        run: npm ci --include=dev

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown

      # wasm-bindgen-cli must match the crate's wasm-bindgen version exactly, so the
      # version is resolved from the lockfile rather than pinned in the immutable action.
      - name: Install wasm-bindgen-cli and wasm-opt
        run: node scripts/setup-wasm-tools.mjs

      - name: Build the Rust text module
        run: node scripts/build-rust-wasm.mjs

      - name: Upload pdftext artifacts for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdftext-wasm-${{ github.sha }}
          path: vendor/pdftext-wasm/dist/
          if-no-files-found: warn
          retention-days: 30
