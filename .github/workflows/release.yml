name: Release

# Cuts a release from a `v*` tag.
#
# The full gate runs again here rather than trusting CI's green tick on the same commit.
# A tag can be moved, and it can be pushed to a commit that never went through a pull
# request, so the only honest way to claim a release passed the checks is to run them
# against the exact tree being packaged.

on:
  push:
    tags: ['v*']

# No workflow_dispatch. Everything below derives the version from GITHUB_REF_NAME with
# the leading `v` stripped, so a manual run on `main` would package "pdf-editor-main-web.zip"
# and ask the release action to publish against a branch ref. Re-cutting a release means
# pushing a tag, which is the operation that should be recorded anyway.

# Never cancel a release in progress: an interrupted run can leave a tag with a partial
# set of assets attached, which is worse than a queued second run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Verify, package and publish
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install exact Node dependencies
        run: npm ci --include=dev

      - name: Detect Rust crate
        id: rust
        shell: bash
        run: |
          if [ -f crates/pdftext/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Same reasoning as ci.yml: before crates/pdftext exists there is nothing for the
      # toolchain to do, and installing it on this runner image tripped a cross-device
      # rollback in rustup.
      - name: Set up Rust
        if: steps.rust.outputs.present == 'true'
        uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          audit: 'true'

      # Same ordering as ci.yml and for the same reasons: the freshness proof judges the
      # committed artifacts before anything rebuilds them, the fast gates reject early,
      # and the gates that walk dist/ come after the build that fills it.
      - name: Verify committed WASM artifacts match their manifest
        run: npm run check:wasm:fresh

      - name: Typecheck, lint and test
        run: npm run check

      # Same two gates as ci.yml, invoked as files for the same reason: this workflow is
      # immutable, and a package.json script name is not a contract it can rely on.
      - name: Handle-ownership gate
        run: node scripts/check-handle-leak.mjs

      - name: License and provenance gate
        run: node scripts/check-cargo-deny.mjs

      - name: Build production web app
        run: npm run build

      # Deploy parity: Vercel builds with `build:vercel`, not `build`. A release that
      # cannot be deployed is not a release.
      - name: Verify the Vercel build path still works
        run: npm run build:vercel

      - name: Verify no third-party URL reaches the shipped bundle
        run: npm run check:egress

      - name: Enforce bundle budgets
        run: npm run check:size

      - name: Supply-chain gate
        run: npm run check:supply

      - name: Install browser families
        run: npx playwright install --with-deps chromium firefox

      - name: Browser acceptance against the production build
        run: npm run test:e2e

      - name: Package the static release
        id: package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .output
          mkdir -p .output

          version="${GITHUB_REF_NAME#v}"
          archive="pdf-editor-${version}-web.zip"

          # Zipped from inside dist/ so the archive expands into a servable root rather
          # than a nested dist/ directory.
          #
          # -X drops extra file attributes (uid, gid, and the platform-specific extra
          # fields). Without it the archive carries the runner's own metadata, so two
          # builds of identical bytes produce different SHA256SUMS and the checksum
          # cannot be independently reproduced. The entry order is fixed for the same
          # reason: `find | sort` rather than letting the filesystem decide.
          (cd dist && find . -type f | LC_ALL=C sort | zip -qX "../.output/${archive}" -@)

          # Relative names only. `sha256sum -c SHA256SUMS` has to work in whatever
          # directory a person downloads the assets into.
          (cd .output && sha256sum "${archive}" > SHA256SUMS)

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          cat .output/SHA256SUMS

      - name: Create the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            .output/*.zip
            .output/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            A private, local-first PDF viewer and editor for the web.

            `${{ steps.package.outputs.archive }}` contains the built application as
            static files. Serve it from any origin: documents are opened, rendered and
            edited entirely in the browser, and nothing is uploaded. There are no
            accounts, no telemetry, and no remote code.

            Verify the download against `SHA256SUMS` before serving it.
