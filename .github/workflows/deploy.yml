name: Deploy (Vercel)

# Deployment is gated on CI, deliberately.
#
# Vercel's native Git integration builds on every push and knows nothing about whether
# the gates passed, so a red typecheck, a failed oracle run or a third-party URL reaching
# the bundle would all deploy anyway. Hanging the deploy off `workflow_run` means nothing
# reaches a URL that CI has not already accepted, which matters more here than usual: the
# zero-egress promise in ADR 0002 is enforced by a gate, not by the platform.
#
# The trade-off is that Vercel rebuilds rather than reusing CI's verified `dist/`.
# Deploying prebuilt output would mean restating vercel.json's headers in Build Output
# API form, and two copies of a security header set is exactly how one of them goes
# stale. Vercel builds from vercel.json, and deploy-check.mjs then asserts the headers
# that actually arrived.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      production:
        description: Deploy to production rather than a preview.
        required: false
        default: false
        type: boolean

# Two pushes to the same branch should not race to claim the same alias.
concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build on Vercel and smoke-test the result
    # A CI run that failed, was cancelled, or was skipped must not deploy. workflow_run
    # fires for every conclusion, so this is the actual gate.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Secrets cannot be read from a job-level `if`, so the guard is a step. Absent
      # credentials leave this workflow inert rather than permanently red: the repo is
      # usable by someone who has not linked a Vercel project, which is the same reason
      # scripts/cargo.mjs and build-wasm.mjs skip instead of failing off CI.
      - name: Check for Vercel credentials
        id: guard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Vercel deployment skipped"
              echo
              echo "Set \`VERCEL_TOKEN\`, \`VERCEL_ORG_ID\` and \`VERCEL_PROJECT_ID\`"
              echo "as repository secrets to enable it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # workflow_run checks out the default branch unless told otherwise, which would
      # deploy something other than the commit CI just verified.
      - name: Check out the verified commit
        if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Set up Node.js
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Only `main` earns the production alias. Everything else, including a manual run,
      # gets a preview URL.
      - name: Resolve the deployment target
        if: steps.guard.outputs.ready == 'true'
        id: target
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          FORCE_PRODUCTION: ${{ inputs.production }}
        run: |
          set -euo pipefail
          if [ "$HEAD_BRANCH" = "main" ] || [ "$FORCE_PRODUCTION" = "true" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.guard.outputs.ready == 'true'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET_FLAG: ${{ steps.target.outputs.flag }}
        run: |
          set -euo pipefail
          # Build the argument list as an array: an empty --prod would otherwise have to
          # survive word-splitting, and `set -u` plus an unquoted empty var is a trap.
          args=(deploy --token "$VERCEL_TOKEN" --yes)
          if [ "$TARGET_FLAG" = "--prod" ]; then
            args+=(--prod)
          fi
          url="$(npx --yes vercel@56.4.0 "${args[@]}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      # vercel.json is the only thing standing between a user and a missing security
      # header or a .wasm served as application/octet-stream, and no gate before this
      # point can see it: those headers exist only once the platform has served the file.
      - name: Assert the deployed headers and MIME types
        if: steps.guard.outputs.ready == 'true'
        env:
          # Deployment Protection answers an unauthenticated request with a 302 to
          # vercel.com/sso-api and a text/plain body, so every header assertion fails on
          # a deployment that is actually fine. The bypass header is the supported way
          # through; check-deployment.mjs already reads this and sends
          # x-vercel-protection-bypass when it is set.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/check-deployment.mjs "${{ steps.deploy.outputs.url }}"

      - name: Report the deployment
        if: steps.guard.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
        run: |
          set -euo pipefail
          {
            echo "### Deployed to $ENVIRONMENT"
            echo
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"
