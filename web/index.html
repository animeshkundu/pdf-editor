<!doctype html>
<html lang="en" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!--
      Default-deny CSP.

      `connect-src 'self'` rather than 'none': the MuPDF WASM binary is fetched from
      our own origin at runtime, so a blanket deny is not achievable. The zero-egress
      guarantee is instead proven by scripts/check-no-egress.mjs, which asserts every
      fetch/URL literal in the shipped bundle is same-origin or relative.

      `'wasm-unsafe-eval'` is required to compile WebAssembly and does NOT permit
      eval() of JavaScript.

      `frame-ancestors` is deliberately absent. It is ignored by specification when a
      policy arrives in a <meta> element, and declaring it anyway makes every browser
      log an error on every page load. Clickjacking protection comes from the
      `Content-Security-Policy: frame-ancestors 'none'` and `X-Frame-Options: DENY`
      response headers in vercel.json, which are the only place it can work.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' blob: data:; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <title>PDF Editor</title>
    <link rel="icon" href="./favicon.svg" />
    <meta
      name="description"
      content="A private, local-first PDF viewer and editor. Files never leave your device."
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This editor requires JavaScript and WebAssembly.</noscript>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
